[workspace]
resolver = "3"
members = ["crates/nighthawk-sim", "crates/nighthawk-tui"]

# Lints shared by every crate (each crate opts in with `[lints] workspace = true`).
# Thresholds live in clippy.toml.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Complexity guards. These are opt-in lints, so they're switched on here.
too_many_lines = "warn"
excessive_nesting = "warn"
cognitive_complexity = "warn"
